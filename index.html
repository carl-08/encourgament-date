<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Envelope Love Letter | Custom Background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --rose: #e11d48;
      --rose-light: #fb7185;
      --rose-deep: #be123c;
      --green-accent: #52B788;
      --wax-gold: #c2410c;
      --cream: #fff9f0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Custom background image - change filename if needed */
      background: url('background.png') center/cover no-repeat fixed;
      font-family: 'Segoe UI', 'Quicksand', 'Poppins', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      position: relative;
      padding: 1.5rem;
    }

    /* subtle overlay to make content pop over custom background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.15);
      pointer-events: none;
      z-index: 0;
    }

    /* decorative romantic elements - balanced around edges (optional, but adds charm) */
    .bg-deco {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-deco::before {
      content: '🌸🌼🌸';
      position: absolute;
      left: 5%;
      top: 12%;
      font-size: 2.5rem;
      opacity: 0.3;
      white-space: nowrap;
      animation: floatDeco 14s infinite alternate;
      text-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .bg-deco::after {
      content: '🍃💌🍃';
      position: absolute;
      right: 5%;
      bottom: 12%;
      font-size: 2.3rem;
      opacity: 0.3;
      white-space: nowrap;
      animation: floatDeco 12s infinite alternate-reverse;
      text-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    @keyframes floatDeco {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
      100% { transform: translateY(-15px) rotate(3deg); opacity: 0.45; }
    }

    /* main container - perfectly centered both axis */
    .scene {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      z-index: 20;
    }

    /* envelope container - centered and balanced */
    .envelope-container {
      position: relative;
      width: 540px;
      max-width: 90vw;
      height: 360px;
      cursor: pointer;
      transition: transform 0.25s ease;
      filter: drop-shadow(0 22px 32px rgba(0,0,0,0.25));
      margin: 0 auto;
    }
    .envelope-container:hover {
      transform: translateY(-6px);
    }

    /* envelope base */
    .envelope {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffd6dc 0%, #f9a8b8 90%);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: inset 0 1px 4px rgba(255,255,240,0.8), 0 12px 28px rgba(0,0,0,0.25);
    }

    /* flap (triangle lid) */
    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 280px;
      background: linear-gradient(150deg, #ffb7c5 0%, #f4728b 80%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(0.34, 1.2, 0.64, 1);
      z-index: 60;
      border-radius: 24px 24px 0 0;
      box-shadow: inset 0 -3px 5px rgba(0,0,0,0.02);
    }

    /* envelope inner base shading */
    .base-shadow {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65%;
      background: linear-gradient(0deg, rgba(0,0,0,0.02), rgba(255,200,200,0.1));
      border-radius: 0 0 24px 24px;
      pointer-events: none;
    }

    /* wax seal (clickable) */
    .wax-seal {
      position: absolute;
      top: 140px;
      left: 50%;
      transform: translateX(-50%);
      width: 88px;
      z-index: 70;
      cursor: pointer;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,0.3));
      transition: transform 0.2s ease, filter 0.2s;
    }
    .wax-seal:hover {
      transform: translateX(-50%) scale(1.05);
      filter: drop-shadow(0 14px 18px rgba(0,0,0,0.35));
    }

    /* inner letter preview (subtle hint) */
    .inner-letter-preview {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 25;
      pointer-events: none;
      transition: opacity 0.2s;
      color: var(--rose);
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .inner-letter-preview p {
      color: var(--rose);
      font-weight: 500;
      font-size: 1rem;
    }

    /* when open, hide preview */
    .envelope-container.open .inner-letter-preview {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s;
    }

    /* sliding letter - emerges from envelope */
    .sliding-letter {
      position: fixed;
      bottom: -100%;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      max-width: 86vw;
      background: linear-gradient(145deg, #fffef7, #fff9ea);
      border-radius: 36px;
      padding: 2rem 1.8rem 2.2rem;
      box-shadow: 0 40px 70px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(225, 29, 72, 0.25);
      z-index: 200;
      text-align: center;
      opacity: 0;
      transition: bottom 0.9s cubic-bezier(0.2, 0.9, 0.4, 1.2), opacity 0.6s ease;
      backdrop-filter: blur(0px);
      border: 1px solid rgba(225, 29, 72, 0.4);
    }

    /* active sliding letter (slide up & reveal) */
    .sliding-letter.slide-up {
      bottom: 50%;
      transform: translate(-50%, 50%);
      opacity: 1;
    }
    /* adjust for better vertical centering */
    @media (min-width: 700px) {
      .sliding-letter.slide-up {
        bottom: 50%;
        transform: translate(-50%, 50%);
      }
    }

    /* message content slow reveal */
    .message-content {
      overflow: hidden;
    }
    .romantic-title {
      font-size: 2rem;
      color: var(--rose);
      margin-bottom: 1rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      transform: translateY(20px);
      opacity: 0;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }
    .romantic-text {
      font-size: 1.2rem;
      line-height: 1.5;
      color: #2c5f2d;
      margin: 1rem 0 1.5rem;
      transform: translateY(20px);
      opacity: 0;
      transition: transform 0.5s ease 0.15s, opacity 0.5s ease 0.15s;
      font-weight: bold;
      font-style: italic;
    }
    .signature {
      font-style: italic;
      font-weight: 500;
      color: var(--rose-deep);
      transform: translateY(20px);
      opacity: 0;
      transition: transform 0.5s ease 0.3s, opacity 0.5s ease 0.3s;
    }
    .slide-up .romantic-title,
    .slide-up .romantic-text,
    .slide-up .signature {
      transform: translateY(0);
      opacity: 1;
    }

    /* button group in sliding letter */
    .letter-buttons {
      display: flex;
      gap: 28px;
      justify-content: center;
      margin-top: 36px;
      transform: translateY(20px);
      opacity: 0;
      transition: transform 0.5s ease 0.45s, opacity 0.5s ease 0.45s;
      position: relative;
    }
    .slide-up .letter-buttons {
      transform: translateY(0);
      opacity: 1;
    }
    .letter-buttons button {
      padding: 12px 28px;
      border: none;
      border-radius: 60px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 5px 0 rgba(0,0,0,0.08);
      font-family: inherit;
    }
    #yesSlideBtn {
      background: var(--rose);
      color: white;
      box-shadow: 0 5px 0 #9f1239;
    }
    /* No button styles - will be moving */
    #noSlideBtn {
      background: #e2e8f0;
      color: #334155;
      box-shadow: 0 5px 0 #cbd5e1;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.6, 1.1);
      position: relative;
    }
    .letter-buttons button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #9f1239;
    }
    .letter-buttons button:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      filter: brightness(0.96);
    }
    /* "No" button runaway effect: it will move when hovered */
    .runaway-btn {
      transition: transform 0.2s cubic-bezier(0.34, 1.2, 0.64, 1) !important;
    }

    /* close button */
    .close-slide-letter {
      position: absolute;
      top: 16px;
      right: 20px;
      background: #fecdd3;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 40px;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      color: var(--rose);
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      z-index: 210;
    }
    .close-slide-letter:hover {
      background: var(--rose);
      color: white;
      transform: scale(1.08);
    }

    /* toast feedback */
    .toast-feedback {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #2b5e3b;
      color: #fff3e0;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: bold;
      z-index: 300;
      font-size: 1rem;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      background: rgba(82, 183, 136, 0.95);
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
      transition: opacity 0.2s;
      pointer-events: none;
      font-family: monospace;
      opacity: 0;
      visibility: hidden;
    }

    /* envelope fall animation when opened */
    .envelope-container.open {
      pointer-events: none;
      animation: envelopeFloatDown 1.1s forwards cubic-bezier(0.4, 0.8, 0.2, 1);
    }
    @keyframes envelopeFloatDown {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
        filter: drop-shadow(0 20px 30px rgba(0,0,0,0.2));
      }
      40% {
        transform: translateY(40px) rotate(-1deg);
        opacity: 0.9;
      }
      100% {
        transform: translateY(460px) rotate(1deg);
        opacity: 0;
        visibility: hidden;
      }
    }

    .envelope-container.open .flap {
      transform: rotateX(180deg);
    }
    .envelope-container.open .wax-seal {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* responsive adjustments */
    @media (max-width: 640px) {
      .envelope-container {
        width: 90vw;
        height: 300px;
      }
      .flap {
        height: 230px;
      }
      .wax-seal {
        top: 110px;
        width: 72px;
      }
      .sliding-letter {
        width: 92vw;
        padding: 1.5rem;
      }
      .romantic-title {
        font-size: 1.5rem;
      }
      .romantic-text {
        font-size: 1rem;
      }
      .letter-buttons button {
        padding: 8px 18px;
      }
    }

    body.letter-open {
      overflow: hidden;
    }

    /* extra centering alignment utility */
    .flex-center {
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
<div class="bg-deco"></div>
<div class="scene">
  <div class="envelope-container" id="envelopeContainer">
    <div class="envelope" id="envelopeBase">
      <div class="flap" id="flap"></div>
      <div class="base-shadow"></div>
      <!-- Wax seal trigger -->
      <div class="wax-seal" id="waxSealTrigger">
        <svg viewBox="0 0 100 100" style="width: 100%; height: auto; display: block;">
          <circle cx="50" cy="50" r="44" fill="#b45309" stroke="#7c2d12" stroke-width="1.5" />
          <circle cx="50" cy="50" r="38" fill="#e07a2c" stroke="#b45309" stroke-width="1.2" />
          <path d="M50 25 L58 45 L80 48 L64 62 L70 84 L50 72 L30 84 L36 62 L20 48 L42 45 Z" fill="#ffd966" stroke="#b45f1b" stroke-width="1.2" stroke-linejoin="round" />
          <circle cx="50" cy="50" r="6" fill="#9a3412" />
          <text x="50" y="68" font-size="9" text-anchor="middle" fill="#ffedd5" font-weight="bold">❤</text>
        </svg>
      </div>
      <!-- subtle preview inside envelope -->
      <div class="inner-letter-preview">
        <p>to: Cyrene</p>
      </div>
    </div>
  </div>
</div>

<!-- Sliding Letter that will emerge and reveal content -->
<div class="sliding-letter" id="slidingLetter">
  <button class="close-slide-letter" id="closeSlideBtn">✕</button>
  <div class="message-content">
    <div class="romantic-title">Hi Cyrene =D</div>
    <div class="romantic-text">
        Will You Join Me On An Encouragement Date 
        this SUNDAY?
    </div>
    <div class="signature">💖 From Carl John 💖</div>
  </div>
  <div class="letter-buttons">
    <button id="yesSlideBtn">Yes, absolutely 💕</button>
    <button id="noSlideBtn" class="runaway-btn">Maybe later 🌸</button>
  </div>
</div>

<div id="toastMsg" class="toast-feedback">✨</div>

<script>
  (function() {
    // DOM elements
    const envelopeContainer = document.getElementById('envelopeContainer');
    const waxSeal = document.getElementById('waxSealTrigger');
    const slidingLetter = document.getElementById('slidingLetter');
    const closeSlideBtn = document.getElementById('closeSlideBtn');
    const yesBtn = document.getElementById('yesSlideBtn');
    const noBtn = document.getElementById('noSlideBtn');
    const toast = document.getElementById('toastMsg');
    
    let isOpened = false;
    let letterSlid = false;
    let noButtonActive = true;

    // Helper: toast message
    function showToast(text, isHappy = true) {
      toast.textContent = text;
      toast.style.backgroundColor = isHappy ? '#52B788' : '#e11d48';
      toast.style.opacity = '1';
      toast.style.visibility = 'visible';
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.visibility = 'hidden';
      }, 2600);
    }
    
    // Function: make No button run away from mouse (playful effect)
    function setupRunawayButton() {
      if (!noBtn) return;
      // ensure button is positioned relatively for transform
      noBtn.style.position = 'relative';
      noBtn.style.transition = 'transform 0.2s cubic-bezier(0.2, 0.95, 0.4, 1.1)';
      
      let moveAttempts = 0;
      
      const handleMouseEnter = (e) => {
        if (!noButtonActive) return;
        if (noBtn.disabled) return;
        
        // calculate random direction: move away from cursor
        const btnRect = noBtn.getBoundingClientRect();
        const mouseX = e.clientX;
        const mouseY = e.clientY;
        
        // find center of button
        const btnCenterX = btnRect.left + btnRect.width / 2;
        const btnCenterY = btnRect.top + btnRect.height / 2;
        
        // vector from mouse to button center
        let deltaX = btnCenterX - mouseX;
        let deltaY = btnCenterY - mouseY;
        const length = Math.hypot(deltaX, deltaY);
        if (length < 0.1) return;
        
        // normalize direction and move by 35-65px in that direction (runaway!)
        const moveScale = Math.min(65, Math.max(35, 100 - moveAttempts * 2));
        const moveX = (deltaX / length) * moveScale;
        const moveY = (deltaY / length) * moveScale;
        
        // apply transform
        noBtn.style.transform = `translate(${moveX}px, ${moveY}px)`;
        moveAttempts++;
        
        // optional small vibration effect
        noBtn.style.transition = 'transform 0.18s cubic-bezier(0.34, 1.2, 0.64, 1)';
        
        // reset position after 0.6s if not hovered again
        clearTimeout(window.runawayResetTimer);
        window.runawayResetTimer = setTimeout(() => {
          if (noBtn && !noBtn.disabled && noButtonActive) {
            noBtn.style.transform = '';
          }
        }, 500);
      };
      
      const handleMouseLeave = () => {
        if (!noBtn.disabled && noButtonActive) {
          noBtn.style.transform = '';
        }
        clearTimeout(window.runawayResetTimer);
      };
      
      noBtn.addEventListener('mouseenter', handleMouseEnter);
      noBtn.addEventListener('mouseleave', handleMouseLeave);
    }
    
    // Open envelope and trigger sliding letter reveal
    function openEnvelopeAndSlideLetter() {
      if (isOpened) return;
      isOpened = true;
      
      envelopeContainer.classList.add('open');
      
      // Delay sliding letter to sync with envelope open & fall
      setTimeout(() => {
        if (!letterSlid) {
          revealSlidingLetter();
        }
      }, 550);
    }
    
    // Reveal sliding letter (slide up + slow message reveal)
    function revealSlidingLetter() {
      if (letterSlid) return;
      letterSlid = true;
      
      slidingLetter.classList.add('slide-up');
      document.body.classList.add('letter-open');
      
      // Once the letter is up, activate the "runaway" No button behavior
      setTimeout(() => {
        if (noBtn && !noBtn.disabled) {
          setupRunawayButton();
        }
      }, 200);
      
      // Optional heartbeat effect on title
      setTimeout(() => {
        const title = document.querySelector('.romantic-title');
        if(title) title.style.animation = 'gentlePulse 0.6s ease';
      }, 400);
    }
    
    // Close sliding letter
    function closeLetter() {
      if (!slidingLetter.classList.contains('slide-up')) return;
      slidingLetter.classList.remove('slide-up');
      document.body.classList.remove('letter-open');
      showToast("💌 Letter closed. Refresh to experience again 💌", false);
      // disable runaway if needed
      if (noBtn) noBtn.style.transform = '';
    }
    
    // Yes response: sweet reaction
    function handleYesResponse() {
      showToast("Yun oh, Xana halls! 🎉", true);
      const msgDiv = document.querySelector('.romantic-text');
      const titleDiv = document.querySelector('.romantic-title');
      const signatureSpan = document.querySelector('.signature');
      if (titleDiv) titleDiv.innerHTML = "MATSALAB BOSS! 💗";
      if (msgDiv) msgDiv.innerHTML = "See you this Sunday! Can't wait to make chika and encouragement together! 🌟";
      if (signatureSpan) signatureSpan.innerHTML = "— Regards, Carl John 💫";
      if (yesBtn) yesBtn.disabled = true;
      if (noBtn) {
        noBtn.disabled = true;
        noButtonActive = false;
        noBtn.style.transform = '';
        noBtn.style.opacity = '0.6';
        noBtn.style.cursor = 'default';
      }
      yesBtn.disabled = true;
      yesBtn.style.opacity = '0.6';
    }
    
    // No response - since it runs away, but if someone still clicks somehow
    function handleNoResponse() {
      showToast("ARAY MOH! 😢", false);
      const msgDiv = document.querySelector('.romantic-text');
      const titleDiv = document.querySelector('.romantic-title');
      const signatureSpan = document.querySelector('.signature');
      if (titleDiv) titleDiv.innerHTML = "ARAY MOH! 💔";
      if (msgDiv) msgDiv.innerHTML = "Sayang, libre pa naman sana kita this Sunday! 😢";
      if (signatureSpan) signatureSpan.innerHTML = "— Maybe next time? 🥺";
      if (yesBtn) yesBtn.disabled = true;
      if (noBtn) {
        noBtn.disabled = true;
        noButtonActive = false;
        noBtn.style.transform = '';
      }
      yesBtn.style.opacity = '0.6';
      noBtn.style.opacity = '0.6';
    }
    
    // Event listeners
    if (waxSeal) {
      waxSeal.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!isOpened) openEnvelopeAndSlideLetter();
      });
    }
    
    if (envelopeContainer) {
      envelopeContainer.addEventListener('click', (e) => {
        if (e.target === waxSeal || waxSeal.contains(e.target)) return;
        if (!isOpened) openEnvelopeAndSlideLetter();
      });
    }
    
    if (yesBtn) yesBtn.addEventListener('click', handleYesResponse);
    if (noBtn) {
      // regular click (if they manage to click despite runaway)
      noBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (noBtn.disabled) return;
        handleNoResponse();
      });
    }
    
    if (closeSlideBtn) closeSlideBtn.addEventListener('click', closeLetter);
    
    slidingLetter.addEventListener('click', (e) => e.stopPropagation());
    
    // After envelope fall animation ends, ensure letter high z-index
    envelopeContainer.addEventListener('animationend', (e) => {
      if (e.animationName === 'envelopeFloatDown') {
        envelopeContainer.style.visibility = 'hidden';
        slidingLetter.style.zIndex = '250';
      }
    });
    
    // Add gentle pulse animation for title
    const style = document.createElement('style');
    style.textContent = `
      @keyframes gentlePulse {
        0% { transform: scale(1); text-shadow: 0 0 0px rgba(225,29,72,0);}
        50% { transform: scale(1.02); text-shadow: 0 0 8px rgba(225,29,72,0.3);}
        100% { transform: scale(1); text-shadow: 0 0 0px rgba(225,29,72,0);}
      }
    `;
    document.head.appendChild(style);
    
    // Force centering on window resize (ensuring sliding letter stays centered)
    window.addEventListener('resize', () => {
      if (slidingLetter.classList.contains('slide-up')) {
        // re-center fix
        slidingLetter.style.transform = 'translate(-50%, 50%)';
      }
    });
    
    console.log("Love letter ready! Everything is fixed and working!");
  })();
</script>
</body>
</html>
